; ============================================================================
;  OOT keyboard + mouse settings for Lichii
; ============================================================================
;  1. Change what you want below and save this file (Notepad is fine).
;  2. Close Lichii.
;  3. Double-click  Apply-Settings.bat  (it is in the same folder as this file).
;  4. Start the game.
;
;  Write  name = value  , one per line. Everything after a ; is a comment.
;  Delete a line to get its default back. If something is misspelled, the
;  script tells you which line and changes nothing.
;
;  KEY NAMES you can use as a value:
;    letters and digits    a ... z    0 ... 9
;    space  enter  tab  backspace  esc  shift  ctrl  alt  capslock
;    up  down  left  right  insert  delete  home  end  pageup  pagedown
;    f1 ... f12
;    comma  period  minus  equals  slash  backslash  semicolon  apostrophe
;    bracketleft  bracketright  grave
;    mouse_left  mouse_right  mouse_middle  mouse_back  mouse_forward
;    none          (leave the button unassigned)
;  Avoid ctrl, alt and esc for gameplay: Lichii uses Ctrl+Q (quit), Ctrl+F9
;  (mouse panning), Alt (menu bar) and Esc (leave fullscreen).
;
;  The key pictures drawn inside the game (HUD, Basic Controls screen) are
;  fixed images of the DEFAULT keys. If you change a key here it works, but the
;  picture still shows the old one (docs/CONFIGURATION.md explains how to redraw them).
; ============================================================================

[buttons]
button_y     = mouse_left      ; attack
button_a     = space           ; action / hold to run
button_b     = c               ; B (no label in the game)
button_x     = r               ; X (no label in the game)
button_zl    = shift           ; hold to target (focus)
button_zr    = mouse_right     ; use item
button_l     = q               ; quick select items (left)
button_r     = e               ; quick select items (right)
button_r3    = mouse_middle    ; reset the camera behind you
button_l3    = none            ; left stick press
button_plus  = enter           ; menu (+)
button_minus = tab             ; map (-)
dpad_up      = 1               ; accessory
dpad_left    = 2               ; ocarina
dpad_right   = 3               ; Navi
dpad_down    = 4               ; boots
button_home       = none
button_screenshot = none

[movement]
move_up    = w
move_down  = s
move_left  = a
move_right = d
walk_key   = z                 ; hold to walk slowly
walk_speed = 0.5               ; 0.1 (very slow) ... 1.0 (no change)

[mouse]
mouse_sens     = 5.0           ; camera speed: 1.0 (slow) ... 10.0 (fast). 5.0 is Lichii's default
mouse_sens_x   =               ; optional: left/right speed (empty = use mouse_sens)
mouse_sens_y   =               ; optional: up/down speed (empty = use mouse_sens)
mouse_invert_y = false         ; true = moving the mouse up looks down
mouse_deadzone_boost = 20      ; 0 ... 100. Raise it if tiny mouse movements do nothing, lower it if the camera jumps
mouse_stop_speed     = 18      ; 0 ... 100. Higher = the camera stops sooner after you stop the mouse
mouse_min_decay      = 6       ; 0 ... 100. Keeps the camera from drifting; leave it unless you know why
hide_cursor = true             ; hide the mouse pointer after a few idle seconds (needs Ctrl+F9 in the game)
